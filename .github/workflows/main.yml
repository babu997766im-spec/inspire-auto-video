
name: Inspire Official - Auto Video

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  create-video:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install pillow  gTTS

      - name: Create motivational video
        run: python main.py

      - name: Save video for download
        uses: actions/upload-artifact@v4
        with:
          name: inspire-official-video
          path: "inspire official.mp4"
          if-no-files-found: error
