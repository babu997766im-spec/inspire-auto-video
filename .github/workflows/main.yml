name: Inspire Official - Test Script

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  test-script:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run motivational script
        run: python main.py
